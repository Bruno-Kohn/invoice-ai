# Preprocessing configuration
preprocessing:
  document_detection:
    enabled: true
    method: contour  # contour | none
    min_area_ratio: 0.1
    perspective_transform: true

  deskew:
    enabled: true
    method: hough  # hough | minAreaRect
    max_angle: 45

  enhancement:
    grayscale: true
    clahe:
      enabled: true
      clip_limit: 2.0
      tile_grid_size: [8, 8]
    gaussian_blur:
      enabled: true
      kernel_size: 3
    adaptive_threshold:
      enabled: true
      block_size: 11
      constant: 2
      method: gaussian  # gaussian | mean

  morphology:
    closing:
      enabled: true
      kernel_size: [2, 2]
      iterations: 1

  resize:
    enabled: false
    target_dpi: 300
    max_dimension: 2048
