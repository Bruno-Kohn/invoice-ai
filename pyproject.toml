[project]
name = "invoice-ai"
version = "0.1.0"
description = "Document AI pipeline for structured extraction from invoices: image → preprocessing → quality assessment → OCR → parsing → JSON"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Bruno Kohn"},
]

dependencies = [
    # Computer Vision & Image Processing
    "opencv-python>=4.8",
    "Pillow>=10.0",
    # OCR
    "paddlepaddle>=2.5",
    "paddleocr>=2.7",
    "pytesseract>=0.3.10",
    # Deep Learning
    "torch>=2.0",
    "torchvision>=0.15",
    # Data & Validation
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # LLM
    "openai>=1.0",
    # Scientific & Metrics
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "editdistance>=0.6",
    # Visualization
    "matplotlib>=3.7",
    "seaborn>=0.12",
    # Notebooks
    "jupyter>=1.0",
    "ipykernel>=6.0",
    # Utilities
    "tqdm>=4.65",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "pre-commit>=3.0",
]
demo = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "streamlit>=1.28",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
